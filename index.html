<style>

.mv{transition:transform .9s ease}.ap1{animation:apl 1.2s .3s forwards}.ap2{animation:apr 1.2s .3s forwards}details[open]>div{animation:up .4s both}@keyframes apl{to{transform:translateX(-45px)}}@keyframes apr{to{transform:translateX(45px)}}.sm{animation:rise 2s infinite;fill:#555}

<header><h1>Organic Chemistry Boards · Topic 4</h1><small id="sc"></small></header><nav id="nav"></nav><main id="app"></main>
<script>
const $=s=>document.querySelector(s),f=s=>s.replace(/(<[^>]*>)|([A-Za-z\)\]])(\d+)/g,(m,t,a,b)=>t||a+'<sub>'+b+'</sub>'),set=(s,h)=>$(s).innerHTML=f(h);
const S=44,NM=['meth','eth','prop','but','pent','hex','hept','oct','non','dec'];
function mol(A,B,o={}){const xs=A.map(a=>a[1]),ys=A.map(a=>a[2]),x0=Math.min(...xs)-.6,y0=Math.min(...ys)-.6,W=(Math.max(...xs)-x0+.6)*S,H=(Math.max(...ys)-y0+.6)*S,k=o.k||1,P=(x,y)=>[(x-x0)*S,(y-y0)*S];
let s=`<svg class="mol" viewBox="0 0 ${W} ${H}" width="${W*k}" height="${H*k}">`;
B.forEach(([i,j,d,c],n)=>{const a=P(A[i][1],A[i][2]),b=P(A[j][1],A[j][2]),L=Math.hypot(b[0]-a[0],b[1]-a[1]),ux=(b[0]-a[0])/L,uy=(b[1]-a[1])/L,r=11;(d==2?[-3.5,3.5]:[0]).forEach(t=>s+=`<line pathLength="1" class="bd ${c||''}" style="animation-delay:${n*.03}s" x1="${a[0]+ux*r-uy*t}" y1="${a[1]+uy*r+ux*t}" x2="${b[0]-ux*r-uy*t}" y2="${b[1]-uy*r+ux*t}"/>`)});
A.forEach(([l,x,y,c,m],n)=>{const[px,py]=P(x,y),b=o.num&&m,dl=`animation-delay:${.15+n*.025}s`;s+=(b?`<circle cx="${px}" cy="${py}" r="11" fill="var(--blu)"/>`:'')+`<text class="at ${c||''}" style="${dl}${b?';fill:#fff':''}" x="${px}" y="${py}">${b?m:l}</text>`});return s+'</svg>'}
function chain(n,subs=[],o={}){const A=[],B=[],ad=(l,x,y,c,m)=>A.push([l,x,y,c,m])-1,bd=(i,j,d,c)=>B.push([i,j,d,c]),X=p=>1.4*p,D={CH3:2,C2H5:3,OH:2,Br:1,Cl:1};
const y=Math.max(1,...subs.filter(s=>s[1]=='u').map(s=>D[s[2]])),cs=[],ch=o.hl?'ch':'';
for(let i=0;i<n;i++){cs.push(ad('C',X(i+1),y,ch,i+1));if(i)bd(cs[i-1],cs[i],(o.db||[]).some(d=>d[0]==i)?2:1,ch)}
const H=(p,x,yy,c)=>bd(p,ad('H',x,yy,c),1,c),
grp=(p,x,dir,g)=>{const yy=y+dir;if(g=='Br'||g=='Cl'){bd(p,ad(g,x,yy,'br'),1,'br');return}
if(g=='OH'){const o1=ad('O',x,yy,'br');bd(p,o1,1,'br');H(o1,x,yy+dir,'br');return}
const c1=ad('C',x,yy,'br');bd(p,c1,1,'br');H(c1,x-.85,yy,'br');H(c1,x+.85,yy,'br');if(g=='CH3'){H(c1,x,yy+dir,'br');return}
const c2=ad('C',x,yy+dir,'br');bd(c1,c2,1,'br');H(c2,x-.85,yy+dir,'br');H(c2,x+.85,yy+dir,'br');H(c2,x,yy+2*dir,'br')};
cs.forEach((p,i)=>{const x=X(i+1),P=i+1;[['u',-1],['d',1]].forEach(([s,dir])=>{const g=subs.find(t=>t[0]==P&&t[1]==s);if(!g&&(o.db||[]).some(d=>(d[0]==P&&d[1]==s)||(d[0]+1==P&&d[2]==s)))return;g?grp(p,x,dir,g[2]):H(p,x,y+dir)})});
const r=subs.find(t=>t[0]==n&&t[1]=='r');H(cs[0],0,y);r?bd(cs[n-1],ad(r[2],X(n+1),y,'br'),1,'br'):H(cs[n-1],X(n+1),y);return mol(A,B,o)}
const skel=(d,l,x,y,w=170)=>`<svg class="mol" viewBox="0 0 ${w} 60" width="${w}" height="60"><path pathLength="1" class="bd" d="${d}"/>${l?`<text class="at" x="${x}" y="${y}">${l}</text>`:''}</svg>`;
const ethene=mol([['C',1.5,1.5],['C',3,1.5],['H',.6,.6],['H',.6,2.4],['H',3.9,.6],['H',3.9,2.4]],[[0,1,2],[0,2],[0,3],[1,4],[1,5]]);
const cprop=mol([['C',2,1],['C',1.1,2.5],['C',2.9,2.5],['H',1.3,.3],['H',2.7,.3],['H',.2,2.1],['H',.8,3.4],['H',3.8,2.1],['H',3.2,3.4]],[[0,1],[1,2],[2,0],[0,3],[0,4],[1,5],[1,6],[2,7],[2,8]]);
const cbut=mol([['C',1.5,1.5],['C',3,1.5],['C',1.5,3],['C',3,3],['H',1.5,.5],['H',.5,1.5],['H',3,.5],['H',4,1.5],['H',1.5,4],['H',.5,3],['H',3,4],['H',4,3]],[[0,1],[0,2],[1,3],[2,3],[0,4],[0,5],[1,6],[1,7],[2,8],[2,9],[3,10],[3,11]]);
const mw=x=>`<div class="mw">${x}</div>`,st=[],cl=(a,l)=>`<span style="color:var(--${a})">${l}</span>`;
let hcI=0,fc='butane',ft='d',an=3,ni=0,nn=0,iI=0,ri=0,ct=0,R={c:1,g:0,s:0},ck=0;
/* 4A.1 */
const HC=[['Methane','CH4',chain(1),1,'1 carbon with 4 bonds to 4 H: the simplest hydrocarbon.'],['Ethane','C2H6',chain(2),1,'2 carbons can hold at most 6 H. It has 6 – full, so saturated.'],['Ethene','C2H4',ethene,0,'Only 4 H although 2 carbons could hold 6. The C=C double bond uses up bonding room – unsaturated.'],['Propane','C3H8',chain(3),1,'Single bonds only; 8 H is the maximum for 3 carbons.'],['Butane','C4H10',chain(4),1,'Single bonds only; 10 H is the maximum for 4 carbons.'],['Cyclopropane','C3H6',cprop,1,'A ring of 3 carbons with only single bonds – a saturated cycloalkane.'],['Cyclobutane','C4H8',cbut,1,'A ring of 4 carbons, only single bonds – saturated.']];
function hc(i){hcI=i;set('#hc',`<div class="row" style="width:100%">${HC.map((m,j)=>`<button class="b${j==i?' on':''}" onclick="hc(${j})">${m[0]}</button>`).join('')}</div>${mw(HC[i][2])}<div style="flex:1;min-width:200px"><h4>${HC[i][0]} · ${HC[i][1]}</h4><span class="pill ${HC[i][3]?'g':'o'}">${HC[i][3]?'saturated':'unsaturated'}</span><p>${HC[i][4]}</p></div>`)}
/* 4A.2 */
const AMB=`<div class="card"><h4>Why a molecular formula is ambiguous: C3H7Cl</h4><div class="row" style="gap:16px"><div class="iso" style="--d:0s">${chain(3,[[3,'r','Cl']])}<small>1-chloropropane</small></div><div class="iso" style="--d:.2s">${chain(3,[[2,'d','Cl']])}<small>2-chloropropane</small></div></div><small>Same atoms, two different compounds.</small></div>`;
const FM={butane:{d:chain(4),s:'CH3–CH2–CH2–CH3<br>or CH3CH2CH2CH3',k:skel('M10,45L50,20L90,45L130,20'),m:'C4H10',e:'C2H5'},chloroethane:{d:chain(2,[[2,'r','Cl']]),s:'CH3–CH2–Cl<br>or CH3CH2Cl',k:skel('M10,45L50,20L84,41','Cl',98,50),m:'C2H5Cl',e:'C2H5Cl'}};
const FD={d:'Shows every atom and every bond. Clearest, but bulky for big molecules.',s:'Groups the atoms on each carbon (CH3, CH2…). Still unambiguous: one formula = one compound.',k:'A zig-zag: every bend and every end is a carbon (with as many H as needed). Atoms other than C and H must be written in.',m:'The actual number of each atom, with no structure shown.',e:'The molecular formula reduced to the simplest whole-number ratio (butane C4H10 → C2H5). Sometimes it equals the molecular formula.'};
function fm(c,t){fc=c||fc;ft=t||ft;const v=FM[fc][ft];set('#fm',`<div class="row">${Object.keys(FM).map(x=>`<button class="b${x==fc?' on':''}" onclick="fm('${x}')">${x}</button>`).join('')}</div><div class="row">${[['d','displayed'],['s','structural'],['k','skeletal'],['m','molecular'],['e','empirical']].map(([k,l])=>`<button class="b${k==ft?' on':''}" onclick="fm(0,'${k}')">${l}</button>`).join('')}</div><div class="stage">${'dk'.includes(ft)?mw(v):`<div class="big">${v}</div>`}<p style="flex:1;min-width:200px">${FD[ft]}</p></div>${ft=='m'?AMB:''}`)}
/* 4A.3 */
function al(d){an=Math.min(6,Math.max(1,an+d));set('#al',`${mw(chain(an))}<p><b>${NM[an-1]}ane</b> · C${an}H${2*an+2} <small>(C<sub>n</sub>H<sub>2n+2</sub> with n = ${an})</small></p>`)}
function bp(){set('#bp',[['CH3OH',65],['CH3CH2OH',79],['CH3CH2CH2OH',97],['CH3CH2CH2CH2OH',117]].map(([n,t])=>`<div class="bar"><span>${n}</span><div><i style="--w:${t/120*100}%"></i></div><b>${t} °C</b></div>`).join(''))}
/* 4A.4 */
const NS=[['propane',3,[],'Longest chain = 3 carbons → prop + ane (every alkane name ends -ane).'],['methylpropane',3,[[2,'d','CH3']],'Longest chain is 3 (prop). One CH3 branch = methyl. No locant needed: on an end carbon it would extend the chain to 4 (butane).'],['2-methylpentane',5,[[2,'d','CH3']],'Chain of 5 (pent). Number from the end giving the lowest locant: 2-, not 4-.'],['3-methylpentane',5,[[3,'d','CH3']],'Chain of 5 carbons; the methyl is on carbon 3.'],['2,3-dimethylbutane',4,[[2,'u','CH3'],[3,'d','CH3']],'Two identical groups → di-. Locants are separated by a comma.'],['3-ethyl-2-methylpentane',5,[[2,'u','CH3'],[3,'d','C2H5']],'Alphabetical order: ethyl before methyl. Locants 3 + 2 = 5 beat 3 + 4, so not 3-ethyl-4-methyl.'],['propan-1-ol',3,[[1,'d','OH']],'The OH group is a suffix (-ol). Its locant goes just before it: propan-1-ol.'],['3-methylbutan-2-ol',4,[[2,'d','OH'],[3,'u','CH3']],'Suffix gets the lowest locant: -2-ol, not -3-ol. The methyl prefix is then on 3.'],['3,3-dimethylbutan-1-ol',4,[[1,'d','OH'],[3,'u','CH3'],[3,'d','CH3']],'Two methyls on carbon 3 → 3,3-dimethyl (repeat the locant). OH on carbon 1 → butan-1-ol.']];
function nm(i,t){if(i!=null)ni=i;if(t)nn=!nn;const[x,n,s,w]=NS[ni];set('#nm',`<div class="row">${NS.map((a,j)=>`<button class="b${j==ni?' on':''}" onclick="nm(${j})">${a[0]}</button>`).join('')}</div><div class="stage">${mw(chain(n,s,{hl:1,num:nn}))}<div style="flex:1;min-width:200px"><h4>${x}</h4><p>${w}</p><label><input type="checkbox" ${nn?'checked':''} onchange="nm(null,1)"> number the chain carbons</label><p class="mut">${cl('blu','Blue')} = longest chain · ${cl('acc','orange')} = branches / other groups</p></div></div>`)}
/* 4A.5 */
const IS=[['C4H10','chain isomers',[['butane',chain(4)],['methylpropane',chain(3,[[2,'d','CH3']])]]],['C5H12','chain isomers',[['pentane',chain(5)],['2-methylbutane',chain(4,[[2,'d','CH3']])],['2,2-dimethylpropane',chain(3,[[2,'u','CH3'],[2,'d','CH3']])]]],['C3H8O','position isomers',[['propan-1-ol',chain(3,[[1,'d','OH']])],['propan-2-ol',chain(3,[[2,'d','OH']])]]],['C4H10O','both types',[['butan-1-ol',chain(4,[[1,'d','OH']])],['butan-2-ol',chain(4,[[2,'d','OH']])],['2-methylpropan-1-ol',chain(3,[[1,'d','OH'],[2,'u','CH3']])],['2-methylpropan-2-ol',chain(3,[[2,'d','OH'],[2,'u','CH3']])]]]];
function iso(i){iI=i;set('#iso',`<div class="row">${IS.map((a,j)=>`<button class="b${j==i?' on':''}" onclick="iso(${j})">${a[0]}</button>`).join('')}</div><p><b>${IS[i][0]}</b>: ${IS[i][2].length} isomers – ${IS[i][1]}</p><div class="row" style="gap:12px;align-items:stretch">${IS[i][2].map((m,k)=>`<div class="iso" style="--d:${k*.18}s">${mw(m[1])}<small>${m[0]}</small></div>`).join('')}</div>`)}
/* 4A.6 */
const RX=[['C2H4 + Br2 → C2H4Br2','add','Two reactants combine into one product: addition.'],['C2H5Br + OH– → C2H5OH + Br–','sub','OH has taken the place of Br; two products form: substitution.'],['C2H5OH + [O] → CH3CHO + H2O','ox','Ethanol loses two hydrogen atoms: oxidation.'],['C2H4 + H2 → C2H6','red','Ethene gains two hydrogen atoms: reduction (it is also an addition).'],['n C2H4 → (C2H4)n','poly','Very many small molecules join into one very large molecule: addition polymerisation.']];
const TY=[['add','addition'],['sub','substitution'],['ox','oxidation'],['red','reduction'],['poly','polymerisation']];
function rr(a){const r=RX[ri];set('#rx',`<div class="eq">${r[0]}</div><div class="row">${TY.map(([k,l])=>`<button class="b${a==k?(k==r[1]?' ok':' no'):''}" onclick="rr('${k}')">${l}</button>`).join('')}</div>${a?`<div class="ex ${a==r[1]?'g':'b'}">${a==r[1]?'✓ '+r[2]:'✗ Not quite – ask what is gained, lost or replaced.'}</div>`:''}<div class="row"><button class="b" onclick="ri=(ri+1)%5;rr()">Next reaction →</button><small>${ri+1} of 5</small></div>`)}
function fis(k){const s=(id,x,y)=>$('#'+id).style.transform=`translate(${x}px,${y}px)`;
if(!k){s('ga',0,0);s('gb',0,0);s('e1',0,0);s('e2',0,0);$('#ca').textContent=$('#cb').textContent='';$('#fl').innerHTML='A covalent bond = a shared pair of electrons.';return}
s('ga',-40,0);s('gb',40,0);$('#ca').textContent=k==2?'+':'';$('#cb').textContent=k==2?'−':'';
if(k==1){s('e1',-72,8);s('e2',88,-8);$('#fl').innerHTML='<b>Homolytic fission</b>: the pair splits equally, one electron each. Two uncharged <b>free radicals</b> form, each with an unpaired electron.'}
else{s('e1',86,2);s('e2',86,-2);$('#fl').innerHTML='<b>Heterolytic fission</b>: one atom keeps <i>both</i> electrons (usually the more electronegative). It becomes a negative ion; the other, a positive ion.'}}
/* 4A.7 */
const HZ=[['!','Health hazard','Warns of skin rashes, eye damage and harm if swallowed.'],['🧪','Corrosive','Can cause skin burns and permanent eye damage.'],['🔥','Flammable','Can catch fire if heated or in contact with a flame.'],['☠','Acute toxicity','Can cause life-threatening effects, even in small quantities.']];
function hz(i){set('#hz',`<div class="row" style="gap:12px">${HZ.map((h,j)=>`<div style="cursor:pointer;opacity:${j==i?1:.6}" onclick="hz(${j})"><svg viewBox="0 0 60 60" width="64" height="64"><polygon points="30,3 57,30 30,57 3,30" fill="#fff" stroke="#d62828" stroke-width="5"/><text x="30" y="37" text-anchor="middle" font-size="22" fill="#000">${h[0]}</text></svg></div>`).join('')}</div><p><b>${HZ[i][1]}:</b> ${HZ[i][2]}</p>`)}
function rk(k,v){if(k)R[k]=v;const r=[1,3,6][R.c]*(R.g?.4:1)*(R.s?.6:1),lv=r<1.2?'Low':r<3?'Medium':'High';set('#rk',`<p>Hydrochloric acid concentration (mol dm⁻³)</p><div class="row">${['0.1','2','10+'].map((x,j)=>`<button class="b${R.c==j?' on':''}" onclick="rk('c',${j})">${x}</button>`).join('')}</div><label><input type="checkbox" ${R.g?'checked':''} onchange="rk('g',this.checked?1:0)"> Wear eye protection</label><br><label><input type="checkbox" ${R.s?'checked':''} onchange="rk('s',this.checked?1:0)"> Small volumes, cap kept on bottle</label><div class="meter"><i style="width:${r/6*100}%"></i></div><p><b>Hazard:</b> corrosive – your precautions never change this. <b>Risk:</b> ${lv}</p>`)}
/* 4B.1 */

{n:'4A.1',t:'What is organic chemistry?',h:`<div class="card"><h3>Early days</h3><p>In the 1800s people believed “organic” substances could only be made by living things. In 1828 Friedrich Wöhler made urea (found in urine) by heating ammonium cyanate, which is <i>not</i> organic. So that idea was wrong.</p><div class="flow"><span>ammonium cyanate</span><em>heat →</em><span>urea</span></div><p>Today: an <b>organic compound contains carbon</b>. Almost all also contain hydrogen; some contain N, O or halogens too.</p></div>
<div class="card"><h3>Hydrocarbons: saturated or unsaturated?</h3><p>A <b>hydrocarbon</b> has <u>only</u> carbon and hydrogen. Sucrose contains oxygen as well, so it is not one (the <i>-ate</i> ending warns of oxygen). In most cases <b>every carbon has four bonds</b>.</p><ul><li><b>Saturated</b>: only single bonds; as much H as possible for that number of carbons.</li><li><b>Unsaturated</b>: has a C=C double bond, so fewer H than the maximum.</li></ul><p>Saturated hydrocarbons are <b>alkanes</b> (chains) and <b>cycloalkanes</b> (rings).</p></div>

{n:'4A.3',t:'Functional groups & homologous series',h:`<div class="card"><h3>Functional group</h3><p>An atom or group of atoms that gives a compound distinctive, predictable properties. COOH gives vinegar its sour, acidic taste.</p><p class="eq">HCOOH → CH3COOH → CH3CH2COOH → CH3CH2CH2COOH</p></div>
<div class="card"><h3>Homologous series</h3><p>A set of compounds with the <b>same functional group</b>, <b>similar chemical properties</b> and physical properties that change gradually. Each member differs from the next by <b>CH2</b>. Alkanes form a series though they are not counted as having a functional group.</p><p>General formula: n = number of carbons (not counting the functional group).</p><table><tr><th>Name</th><th>General formula</th><th>Example</th></tr><tr><td>alkane</td><td>C<sub>n</sub>H<sub>2n+2</sub></td><td>CH4</td></tr><tr><td>alkene</td><td>C<sub>n</sub>H<sub>2n</sub></td><td>C2H4</td></tr><tr><td>halogenoalkane</td><td>C<sub>n</sub>H<sub>2n+1</sub>X</td><td>CH3CH2Br</td></tr><tr><td>alcohol</td><td>C<sub>n</sub>H<sub>2n+1</sub>OH</td><td>CH3CH2OH</td></tr></table></div>

{n:'4A.4',t:'Nomenclature',h:`<div class="card"><h3>Why rules?</h3><p>As compounds multiplied, trivial names (methane was “marsh gas”) became unmanageable. IUPAC set systematic rules.</p><table><tr><th>Part</th><th>How</th><th>Example</th></tr><tr><td>Carbons</td><td>letter code</td><td>meth = 1</td></tr><tr><td>Prefix / suffix</td><td>other atoms before / after code</td><td>bromo, -ol (OH)</td></tr><tr><td>Multiplier</td><td>di-, tri-…</td><td>di = two</td></tr><tr><td>Locant</td><td>number of carbon in longest chain</td><td>2- = carbon 2</td></tr></table><div class="row" style="margin-top:8px">${NM.map((x,i)=>`<span class="pill o">${i+1} ${x}</span>`).join('')}</div></div>

{n:'4A.5',t:'Structural isomerism',h:`<div class="card"><h3>Same formula, different structure</h3><p><b>Structural isomers</b> have the same molecular formula but different structural formulae, so they are different compounds with different names.</p><ul><li><b>Chain isomerism</b>: different carbon chains (butane and methylpropane, both C4H10).</li><li><b>Position isomerism</b>: same functional group on different carbons (propan-1-ol and propan-2-ol).</li></ul></div>

{n:'4A.6',t:'Types of reaction',h:`<div class="card"><h3>Five reaction types</h3><ul><li><b>Addition</b>: A + B → C</li><li><b>Substitution</b>: A + B → C + D (an atom or group is replaced)</li><li><b>Oxidation</b>: gain of oxygen or loss of hydrogen; oxidising agent written [O]</li><li><b>Reduction</b>: gain of hydrogen or loss of oxygen; reducing agent written [H]</li><li><b>Polymerisation</b>: many small molecules form one very large molecule</li></ul></div>

{n:'4A.7',t:'Hazards, risks & risk assessments',h:`<div class="card"><h3>Hazard vs risk</h3><p>A <b>hazard</b> is an inherent property that could cause harm (hydrochloric acid is corrosive). <b>Risk</b> is the chance of that harm happening, which depends on how you use it. Eye protection does not change the hazard; it greatly lowers the risk.</p></div>

<div class="card"><h3>Risk assessments</h3><p>Look at the hazards, assess how substances will be used (the risk), then write <b>control measures</b>: amount used, who is using it, heating, ventilation or fume cupboard, gloves, keeping caps on, keeping away from heat, spill procedures. Apparatus matters too: spirit thermometers beat mercury; electric mantles beat Bunsen burners; ground-glass joints beat corks.</p></div><div class="tip h">Exam hint: “wear a lab coat and goggles” is not enough. Comment on a specific step, e.g. “HCl gas is produced, so use a fume cupboard”.</div>`,i(){hz(1);rk()},q:[

{q:'A flammable liquid must be heated. Which is the best control measure?',o:['Use an electric heating mantle, away from naked flames','Wear a lab coat and goggles only','Heat it as strongly as possible','Use a Bunsen burner and gauze'],a:0,e:'Removing the ignition source cuts the risk. Lab coat and goggles are standard practice, not a specific measure.'}]},
{n:'4B.1',t:'Alkanes from crude oil',h:`<div class="card"><h3>Three processes</h3><p>Most compounds in crude oil and natural gas are alkanes. Three processes turn crude oil into useful fuels. Switch between them:</p><div id="cr"></div></div><div class="tip h">Exam hint: a fraction is still a mixture, just with a smaller range of boiling points.</div>`,i(){cr(0)},q:[
{q:'One molecule of C12H26 is cracked into two molecules of ethene and one molecule of another alkane. Its formula?',o:['C8H18','C10H22','C8H16','C6H14'],a:0,e:'C12H26 − 2 × C2H4 (= C4H8) leaves C8H18.'},
{q:'Why is reforming used on straight-chain alkanes?',o:['To make branched or cyclic hydrocarbons that burn more smoothly','To break long chains into short ones','To separate crude oil by boiling point','To remove sulfur'],a:0,e:'Reforming rearranges molecules with a platinum catalyst. Cracking breaks them; distillation separates them.'}]},
{n:'4B.2',t:'Alkanes as fuels',h:`<div class="card"><h3>Complete vs incomplete combustion</h3><p>Alkanes burn in oxygen. With plenty of O2 only CO2 and H2O form (CO2 is a greenhouse gas). With too little O2 or very rapid burning, combustion is incomplete – but all the hydrogen still becomes water.</p><div id="fl"></div></div>
<div class="card"><h3>Pollutants</h3><details><summary>Carbon monoxide (CO)</summary>Toxic, colourless, odourless. It prevents the blood transporting oxygen – “the silent killer”.</details><details><summary>Carbon particulates (soot)</summary>Tiny solid carbon particles from incomplete combustion; harmful in the atmosphere.</details><details><summary>Unburned hydrocarbons (UHC)</summary>Fuel that leaves the engine without burning.</details><details><summary>Oxides of sulfur</summary>S + O2 → SO2; 2SO2 + O2 → 2SO3. With water: SO2 + H2O → H2SO3, SO3 + H2O → H2SO4. Acid rain harms lakes, crops and forests.</details><details><summary>Oxides of nitrogen (NOx)</summary>At very high temperatures (e.g. near spark plugs) air’s N2 and O2 react: N2 + O2 → 2NO; 2NO + O2 → 2NO2; 2NO2 + H2O → HNO2 + HNO3. Acidic, like sulfur oxides.</details></div>
<div class="card"><h3>Three-way catalytic converter</h3><p>Platinum, rhodium and palladium spread over a honeycomb remove CO, UHC and NOx:</p><p class="eq">2CO + O2 → 2CO2</p><p class="eq">C8H18 + 12½O2 → 8CO2 + 9H2O</p><p class="eq">2NO + 2CO → N2 + 2CO2</p><p>It does little for sulfur – the best fix is low-sulfur fuel.</p></div>`,i(){fl(0)},q:[
{q:'Which equation shows incomplete combustion of propane forming carbon monoxide?',o:['C3H8 + 5O2 → 3CO2 + 4H2O','C3H8 + 4O2 → 2CO + CO2 + 4H2O','C3H8 + 4O2 → C + 2CO2 + 4H2O','C3H8 → 3C + 4H2'],a:1,e:'The CO-forming equation has CO among the products. The third equation forms solid carbon (soot).'},
{q:'In a catalytic converter, what happens to NO and CO?',o:['They react to form N2 and CO2','They form SO2','They form acid rain','They are trapped as soot'],a:0,e:'2NO + 2CO → N2 + 2CO2 removes two pollutants at once.'}]},
{n:'4B.3',t:'Alternative fuels',h:`<div class="card"><h3>The need for alternative fuels</h3><p>Concerns about burning fossil fuels: the pollution from alkane combustion, <b>depletion of natural resources</b>, and <b>global warming and climate change</b> (CO2 is a greenhouse gas).</p><ul><li><b>Biofuels</b>: fuels from living matter that died <i>recently</i> (even wood counts).</li><li><b>Non-renewable</b>: coal, oil, natural gas. <b>Renewable</b>: biofuels, sunlight, wind, waves and tides, geothermal.</li></ul></div>
<div class="card"><h3>Carbon neutrality</h3><p>A <b>carbon neutral</b> fuel has a net zero effect on atmospheric CO2. The closer to neutral, the better.</p><div class="flow"><span>CO2 in air</span><em>absorbed →</em><span>growing plant</span><em>harvest, process →</em><span>fuel</span><em>burned →</em><span>CO2 in air</span></div><p style="color:var(--acc)">+ extra CO2 whenever energy is used to farm, process or transport the fuel.</p><div id="nc"></div></div>
<div class="card"><h3>Bioethanol and hydrogen</h3><p><b>Bioethanol is identical to ethanol</b>; “bio” only describes how it is made: fermentation of sugars by yeast enzymes. The ethanol concentration has an upper limit, so it must be separated from lots of water – which takes energy. Many plants and plant waste can now be used. Fuel blends: E10 = 10% bioethanol + 90% petrol; E85 = 85% + 15%.</p><p><b>Hydrogen</b> (not a biofuel) can be burned in place of petrol, or used in a fuel cell to power an electric motor. Problems: where the energy to make it comes from, and storage (high pressure means a heavy container; liquid needs −253 °C). Battery cars are seen by many as more practical.</p></div>
<div class="card"><h3>Comparing fuels</h3><p>Think: land use, yield, manufacture/transport, carbon neutrality.</p><table><tr><th>Factor</th><th>Bioethanol / biodiesel</th><th>Natural gas</th></tr><tr><td>Land use</td><td>A lot of land; may replace food crops</td><td>None; comes from underground</td></tr><tr><td>Yield</td><td>Low, gradually increasing</td><td>Very high</td></tr><tr><td>Manufacture / transport</td><td>No drilling; substantial growing, processing and transport costs</td><td>Exploration and drilling very costly; processing and pipeline transport cheap</td></tr><tr><td>Carbon neutrality</td><td>Much closer</td><td>Definitely not</td></tr></table></div><div class="tip h">Exam hint: comparison questions often carry 4+ marks – plan on rough paper first, and avoid poorly structured answers. Focus on the bigger picture, not the chemistry of manufacture.</div>`,i(){nc(1)},q:[
{q:'No CO2 forms when hydrogen is used as a fuel. Why is hydrogen still not a carbon neutral fuel?',o:['Making hydrogen from water needs energy, which may come from burning fossil fuels','Hydrogen forms CO when it burns','Hydrogen is a fossil fuel','Hydrogen absorbs CO2 from the air'],a:0,e:'Nearly all hydrogen is in water. Splitting it needs energy; if that is generated by burning fossil fuels, CO2 is still released.'},
{q:'Which is the best reason a biofuel such as bioethanol may not be carbon neutral?',o:['Energy used to grow, process and transport it forms CO2','Plants never absorb CO2','Bioethanol is different from ethanol','It is made from fossil fuels'],a:0,e:'The plants absorbed CO2, but all the farming, processing and transport stages release more, so overall more CO2 is formed than absorbed.'}]},
{n:'4B.4',t:'Substitution reactions of alkanes',h:`<div class="card"><h3>What is a substitution reaction?</h3><p>Alkanes are fairly unreactive: only C and H, only single bonds, and bonds that are not very polar. They don’t react with acids, alkalis or reactive metals. But with a halogen they undergo <b>substitution</b>: one H is replaced by a halogen atom.</p><p class="eq">CH4 + Cl2 → CH3Cl + HCl</p><p>Methane and chlorine don’t react when just mixed. They react at room temperature in <b>ultraviolet light</b> (UV breaks Cl2, not the alkane). A <b>mechanism</b> is the sequence of steps that shows what happens to the electrons.</p></div>
<div class="card"><h3>Free-radical mechanism: step through it</h3><div id="ms"></div></div>
<div class="tip">Learning tip: initiation = one molecule becomes two free radicals. Propagation = a molecule + a radical become a different molecule + a different radical (two steps). Termination = two radicals become one molecule.</div>
<div class="card"><h3>Further substitution</h3><p>The product still has H atoms, so they can be replaced one by one. Each overall step uses the same initiation, propagation and termination sequence. Click to replace more H:</p><div id="sb"></div><p>Because a mixture forms, the yield of any one product is low and products must be separated: this is a poor way to prepare chloromethane or other halogenoalkanes.</p></div>`,i(){ms(0);sb(1)},q:[
{q:'Classify this step: F• + CH4 → HF + CH3•',o:['Initiation','Propagation','Termination','Addition'],a:1,e:'A radical and a molecule become a different molecule and a different radical, and the chain continues: propagation.'},
{q:'Why is chlorinating methane a poor way to make chloromethane?',o:['Further substitution gives a mixture (CH2Cl2, CHCl3, CCl4), lowering yield','Methane is too reactive','It needs very high pressure','It makes no chloromethane at all'],a:0,e:'CH3Cl still contains H atoms, so more are replaced. Several products form and must be separated.'}]},
{n:'Bigger',t:'Thinking bigger: alkanes everywhere',h:`<div class="card"><h3>Alkanes: natural products</h3><p>Alkanes occur widely in nature, mostly from biological processes. Odd-numbered unbranched alkanes are found in fungal spores; even-numbered ones in sedimentary rocks. The output of methane has <b>doubled in the last hundred years</b>, making it a major greenhouse gas. Tap a topic:</p><div id="tb"></div></div><div class="tip h">Did you know? Scientists believe there are lakes of hydrocarbons on Titan, a moon of Saturn.</div><div class="card"><h3>Activity idea</h3><p>What is methane’s impact on climate change? Gather data from reliable sources and consider possible bias in each source.</p></div>`,i(){tb(0)},q:[
{q:'In nature, methane is mostly produced by…',o:['bacteria, e.g. in cows’ intestines and wetlands','volcanoes only','fungi spores','sedimentary rocks'],a:0,e:'Bacteria in animal digestive tracts and wetlands make most natural methane (hence “marsh gas”).'},
{q:'How can microorganisms that metabolise alkanes be useful?',o:['They break contaminants in oil-spill soil into harmless or less harmful substances','They make crude oil','They produce more methane for fuel','They remove CO2 from the air'],a:0,e:'The polluted soil need not be dug up and dumped elsewhere: the microorganisms detoxify it in place.'}]},
{n:'Practice',t:'Exercises with solutions',first:1,h:`<div class="card"><h3>Structured questions · model solutions</h3><p>Try each on paper first, then open the solution. The multiple-choice questions come first, above.</p>

${sol('Exam Q7 – boiling temperatures and reforming','<p>(a) Octane: <b>C8H18</b>.</p><p>(b)(i) Boiling temperature <b>increases</b> as the number of carbon atoms increases; larger molecules have stronger intermolecular forces, so more energy is needed to separate them. (ii) Steps are 36, 33, 30, 27… falling by 3, so nonane ≈ <b>423 K</b> (and decane is then +24 = 447 ✓).</p><p>(c)(i) C10H22 → C8H18 + C2H4</p><p>(c)(ii) C2H4 + H2O → C2H5OH; typical industrial conditions: steam, phosphoric acid catalyst, about 300 °C, 60–70 atm.</p><p>(d)(i)</p><div class="row">'+zig(10)+'<b>→</b>'+zig(8,[2,3])+'</div><p>(d)(ii) heptane → methylcyclohexane + H2</p><div class="row">'+zig(7)+'<b>→</b>'+hex+'<b>+ H2</b></div><p>(d)(iii) Reforming makes branched and cyclic alkanes, which burn more smoothly in engines.</p>')}
${sol('Exam Q8 – compound Y (85.7% C)','<p>(a)(i) C: 85.7 ÷ 12 = 7.14; H (100 − 85.7 = 14.3): 14.3 ÷ 1 = 14.3. Ratio 1 : 2, so empirical formula <b>CH2</b>.</p><p>(ii) Mass of CH2 = 14; 56 ÷ 14 = 4, so molecular formula <b>C4H8</b>.</p><p>(b) The six isomers (the question says five, but six exist):</p>'+isoRow([['but-1-ene',chain(4,[],{db:[[1,'d','d']]})],['but-2-ene (H atoms same side)',chain(4,[],{db:[[2,'d','d']]})],['but-2-ene (H atoms opposite sides)',chain(4,[],{db:[[2,'d','u']]})],['2-methylpropene',chain(3,[[2,'u','CH3']],{db:[[1,'d','d']]})],['cyclobutane',cbut],['methylcyclopropane',mcp]]))}
${sol('Exam Q9 – hydrocarbons A–D','<p>(a) <b>Alkanes</b>: only C and H with single bonds only (saturated), general formula C<sub>n</sub>H<sub>2n+2</sub>. A = butane, B = pentane, C and D = hexane.</p><p>(b) A structural formula shows how the atoms are joined, so each represents one compound. C and D look different but both are the same unbranched six-carbon chain: <b>one compound, hexane</b>.</p><p>(c) Isomers of B (pentane):</p>'+isoRow([['2-methylbutane  CH3CH(CH3)CH2CH3',chain(4,[[2,'d','CH3']])],['2,2-dimethylpropane  C(CH3)4',chain(3,[[2,'u','CH3'],[2,'d','CH3']])]]))}</div>`,i(){},q:[

/* engine */
C.forEach((c,i)=>st[i]=[]);let cur=0;
const qz=(ci,qi)=>{const q=C[ci].q[qi],r=st[ci][qi];return f(`<div class="card" id="q${ci}_${qi}"><b>Check your understanding · Q${qi+1}</b><p>${q.q}</p>${q.s||''}${q.o.map((o,i)=>`<button class="opt ${r?(i==q.a?'ok':i==r.p?'no':''):''}" onclick="ans(${ci},${qi},${i})" ${r?'disabled':''}>${o}</button>`).join('')}${r?`<div class="ex ${r.p==q.a?'g':'b'}">${r.p==q.a?'✓ Correct. ':'✗ Not quite. '}${q.e} <a href="#" onclick="rs(${ci},${qi});return false">Try again</a></div>`:''}</div>`)};
const ok=i=>C[i].q.filter((q,j)=>st[i][j]&&st[i][j].p==q.a).length;
function nav(){$('#nav').innerHTML=C.map((c,i)=>`<button class="tab${i==cur?' on':''}" onclick="go(${i})">${c.n}${ok(i)==C[i].q.length?' ✓':''}</button>`).join('');$('#sc').textContent=`${C.reduce((s,c,i)=>s+ok(i),0)} of ${C.reduce((s,c)=>s+c.q.length,0)} questions correct`}
function ans(ci,qi,i){st[ci][qi]={p:i};$(`#q${ci}_${qi}`).outerHTML=qz(ci,qi);nav()}
function rs(ci,qi){st[ci][qi]=null;$(`#q${ci}_${qi}`).outerHTML=qz(ci,qi);nav()}
function go(i){cur=i;const c=C[i];nav();$('#app').innerHTML=`<h2>${c.n} · ${c.t}</h2>`+(c.first?c.q.map((x,j)=>qz(i,j)).join('')+f(c.h):f(c.h)+c.q.map((x,j)=>qz(i,j)).join(''))+(i<C.length-1?`<button class="b" onclick="go(${i+1})">Next: ${C[i+1].n} →</button>`:'');c.i();scrollTo(0,0)}
go(0);
